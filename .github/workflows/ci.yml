name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Server tests
        run: npm test 2>&1 | tee server-tests.log
      - name: Client tests
        run: npm run test:client 2>&1 | tee client-tests.log
      - run: npm run build
      # Job logs need a signed-in admin; an annotation shows the failures on the public run page.
      - name: Annotate test failures
        if: failure()
        run: |
          failures=$(grep -h -E -A14 '^not ok|FAIL ' server-tests.log client-tests.log 2>/dev/null | head -c 12000 || true)
          [ -n "$failures" ] || exit 0
          failures=${failures//'%'/'%25'}
          failures=${failures//$'\r'/'%0D'}
          failures=${failures//$'\n'/'%0A'}
          echo "::error title=Test failures::$failures"
